name: Build UnX Manager

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'launcher/**'
      - 'UnX/**'
      - 'third_party/**'
      - 'tests/**'
      - 'scripts/prepare-launcher-payload.*'
      - 'scripts/create-launcher-icons.cjs'
      - 'scripts/build.ps1'
      - 'scripts/test.ps1'
      - 'scripts/verify_game_signatures.py'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: read

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Compile the Win32 plugin from source
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install payload build dependencies
        working-directory: launcher
        run: npm ci --ignore-scripts
      - name: Verify and extract the pinned official Special K runtime
        run: node scripts/prepare-launcher-payload.cjs --extract-only artifacts/launcher-baseline
      - name: Build the corrected plugin from this checkout
        shell: pwsh
        run: ./scripts/build.ps1 -SpecialKDll ./artifacts/launcher-baseline/dxgi.dll
      - name: Run native checks and offline signature fixtures
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Store the compiled plugin for both packaging hosts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unx-plugin-win32
          path: |
            artifacts/Win32/Release/unx.dll
            artifacts/Win32/Release/unx.pdb
            artifacts/Win32/Release/unx.map
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package ${{ matrix.platform }} x64
    needs: plugin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            script: build:win
            extension: .exe
          - os: ubuntu-24.04
            platform: linux
            script: build:linux
            extension: .AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # No signing credentials, publishing token, release action, or update feed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked launcher dependencies and Electron runtime
        working-directory: launcher
        run: npm ci
      - name: Run launcher checks
        working-directory: launcher
        run: npm test
      - name: Retrieve the plugin compiled by this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unx-plugin-win32
          path: artifacts/Win32/Release
      - name: Build the verified offline installation payload
        run: node scripts/prepare-launcher-payload.cjs --plugin artifacts/Win32/Release/unx.dll
      - name: Package the native portable launcher
        working-directory: launcher
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Smoke test the packaged Windows interface
        if: runner.os == 'Windows'
        run: node scripts/smoke-launcher.cjs --packaged
      - name: Smoke test the packaged Linux interface
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-launcher.cjs --packaged
      - name: Verify the output format and record checksums
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $PWD 'artifacts/launcher'
          $packages = @(Get-ChildItem -LiteralPath $outputDirectory -File | Where-Object Extension -eq '${{ matrix.extension }}')
          if ($packages.Count -ne 1) { throw 'Expected exactly one native launcher package.' }
          foreach ($package in $packages) {
            $bytes = [System.IO.File]::ReadAllBytes($package.FullName)
            if ('${{ matrix.platform }}' -eq 'windows') {
              if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Windows output is not an executable.' }
            } else {
              if ($bytes.Length -lt 12 -or [BitConverter]::ToUInt32($bytes, 0) -ne 0x464c457f -or $bytes[8] -ne 0x41 -or $bytes[9] -ne 0x49 -or $bytes[10] -ne 0x02) {
                throw 'Linux output is not an ELF AppImage type 2.'
              }
            }
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText(($package.FullName + '.sha256'), ($hash + '  ' + $package.Name + "`n"), [System.Text.Encoding]::ASCII)
          }
          Copy-Item -LiteralPath 'launcher/payload/manifest.json' -Destination (Join-Path $outputDirectory 'payload-manifest.json')
      - name: Store reviewable packages without publishing a release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unx-manager-${{ matrix.platform }}-x64
          path: |
            artifacts/launcher/*.exe
            artifacts/launcher/*.AppImage
            artifacts/launcher/*.sha256
            artifacts/launcher/payload-manifest.json
          if-no-files-found: error
          retention-days: 14
