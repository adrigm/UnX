name: Shorten the 0.10.0 release description

on:
  push:
    branches: [fix/steam-25501027-speed]
    paths: [.github/workflows/shorten-release-description.yml]

permissions:
  contents: write

jobs:
  edit-description:
    if: github.repository == 'adrigm/UnX'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Edit only the existing release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: |
            **UnX 0.10.0 · Manager 1.0.1**
            
            - Fixes the SteamOS/Proton startup crash; texture injection remains available.
            - Disables the legacy Special K updater.
            - Preserves texture cache preferences on Windows.
            
            To update, close the game and select **Update & apply settings** in the new manager.
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          endpoint = "https://api.github.com/repos/adrigm/UnX/releases/422273980"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              current_headers = dict(headers)
              if data is not None:
                  current_headers["Content-Type"] = "application/json"
              req = urllib.request.Request(endpoint, data=data, headers=current_headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          before = request("GET")
          assert before["tag_name"] == "v0.10.0" and not before["draft"]
          assert before["target_commitish"] == "6acacf0e19742ecf597b9f2d701c3304ef499067"
          body = os.environ["RELEASE_BODY"]
          old_hash = hashlib.sha256(before["body"].encode()).hexdigest()
          assert old_hash == "daeaf76fc630a267a51d565f38ce128daad6099a664a53a5b6914b04dbaafc25" or before["body"] == body
          after = request("PATCH", {"body": body})
          assert after["body"] == body
          for key in ("tag_name", "target_commitish", "name", "draft", "prerelease"):
              assert after[key] == before[key], key
          inventory = lambda release: sorted((a["id"], a["name"], a["size"], a.get("digest")) for a in release["assets"])
          assert inventory(after) == inventory(before)
          print("Release description shortened successfully.")
          PY
